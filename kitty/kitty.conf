# --- Fonts ---
font_family      Hack Nerd Font
bold_font        Hack Nerd Font
italic_font      Hack Nerd Font
bold_italic_font Hack Nerd Font
font_size        15.0
foreground       #F5DEB3

# --- Color Scheme & Opacity ---
background_opacity 0.85
#dynamic_background_opacity yes

# --- Terminal Bell ---
enable_audio_bell no

# --- Tabs ---
tab_bar_style powerline
tab_powerline_style slanted

map ctrl+page_up   previous_tab
map ctrl+page_down next_tab

# --- Shell ---
shell /usr/bin/zsh --login

# --- Title Bar ---
# wayland_titlebar_color system
# wayland_titlebar_color red
wayland_titlebar_color background

# --- Window Layout & Aesthetics ---
window_padding_width 8
remember_window_size  yes
initial_window_width  450
initial_window_height 300
hide_window_decorations no
confirm_os_window_close 0

# --- Mouse & Clipboard ---
copy_on_select yes
detect_urls yes
mouse_hide_wait 3.0

# --- cursor ---
cursor_shape_unfocused block
cursor_shape block
cursor #CC66CC
cursor_text_color #F5DEB3
cursor_trail 10
shell_integration no-cursor

